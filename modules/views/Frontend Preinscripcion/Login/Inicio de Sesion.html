<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Inicio de Sesión </title>
    <link rel="stylesheet" href="Login_Style.css">
</head>
<body>
    <form action="#" method="POST">
        <div class="container-main">
            
                <div class="login_container">

                    <div id="imgContainer">
                        <img src="/modules/public/img/area.jpg" alt="">
                    </div>
                    <div class="login-header">
                        <h2>Iniciar sesión</h2>
                        <p>Ingrese sus datos para acceder</p>
                    </div>
                    
                    <div class="input-group">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" name="email" placeholder="unerg@gmail.com" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <button type="submit"id="submit">Iniciar Sesión</button>
                    <a href="/registrar">¿No tienes cuenta? Crea una</a>
                </div>
            
        </div>
    </form>

</body>
</html>
